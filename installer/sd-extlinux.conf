# Debian + intercom installer (SD card boot, controlled over the network: install-screen.sh --net)
TIMEOUT 1
DEFAULT install
LABEL install
	KERNEL /meetme/zImage
	FDT /meetme/sun8i-a33-fermax-meetme.dtb
	INITRD /meetme/initramfs.cpio.gz
	APPEND console=ttyS0,115200 console=tty1 loglevel=7 rdinit=/init meetme.install=net

# User kiosk (uid 1000): the browser runs in a PAM session in this slice,
# so the limits have to be here. When exceeded the kernel kills the kiosk and systemd restarts it.
# No MemoryHigh: the HA dashboard alone takes ~350 MB (with the file cache), and a
# MemoryHigh threshold only throttled the browser and made the whole system grind on swap instead of killing it.
[Slice]
MemoryHigh=infinity
MemoryMax=400M
MemorySwapMax=120M

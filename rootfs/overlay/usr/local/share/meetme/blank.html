<!doctype html>
<html><head><meta charset="utf-8"><title>Blank screen</title>
<style>
	html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
	button {
		width: 100%; height: 100%; border: 0; border-radius: 12px; cursor: pointer;
		display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box;
		font: 500 14px Roboto, "DejaVu Sans", sans-serif; text-align: left;
		background: #fff; color: #212121; box-shadow: 0 0 0 1px #e0e0e0 inset;
	}
	@media (prefers-color-scheme: dark) {
		button { background: #1c1c1c; color: #e1e1e1; box-shadow: 0 0 0 1px #333 inset; }
	}
	.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
		background: rgba(120, 120, 120, .15); flex: none; }
	svg { width: 22px; height: 22px; fill: currentColor; }
</style></head>
<body>
<!-- Dashboard button: asks the local screen-blank daemon to blank the screen immediately -->
<button onclick="fetch('/meetme/blank', {cache: 'no-store'})">
	<span class="ic"><svg viewBox="0 0 24 24"><path d="M3.41 1.86 2 3.27l1 1V17a2 2 0 0 0 2 2h7v2H8v2h8v-2h-4v-2h.73l7 7L21.14 26 3.41 1.86M5 17V6.27L15.73 17H5m16 0V5a2 2 0 0 0-2-2H7.27l2 2H19v10l2 2Z"/></svg></span>
	Blank screen
</button>
</body></html>

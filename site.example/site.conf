# Settings of your home, applied to every screen by installer/provision.sh.
# Copy site.example/ to site/ (git-ignored) and fill it in. Nothing here goes into the image.

# --- Home Assistant (kiosk) ---------------------------------------------------------------
# Address of Home Assistant as seen from the screens
HA_URL=http://192.168.1.10:8123
# Dashboard path shown on the screen
KIOSK_PATH=/lovelace/0
# Long-lived access token of a dedicated, non-admin HA user for the kiosk. nginx on the screen
# injects it, so the screen never shows a login page. Keep this file private.
HA_TOKEN=
# Optional: webhook ID of an HA automation that fires a `meetme_intercom` event for every ring,
# answer, unlock and hangup (see docs/home-assistant.md). Empty = no events.
HA_WEBHOOK_ID=

# --- Intercom (values from the original screens: /dnake/cfg/sys.xml, or docs/protocol.md) ---
# Door panel address
PANEL_IP=192.168.1.110
# Apartment number the panel dials and the panel's own SIP user
ROOM=1000001
PANEL_USER=10001000001
# All screens of the apartment (Debian or original), same list and order on every screen
SCREENS="192.168.1.100 192.168.1.101"
# Fermax cloud app account(s): the panel rings the phone app only if the account is on the list
# the screens send it. Copy it from the discover answer of your original master screen
# (docs/protocol.md, "slaveN" entries such as sip:1234567@sip.fermax.com). Empty = no app ringing.
EXTRA_URLS=""

# --- Video in the call window (optional) ----------------------------------------------------
# RTSP streams without passwords, e.g. from go2rtc/Frigate. The panel itself serves
# rtsp://admin:123456@PANEL_IP:8554/ch01 (factory credentials), but does not send video over SIP
# before the call is answered; a relay such as go2rtc keeps the password off the screens.
PANEL_VIDEO_URL=
CAMERA_URL=

# --- Screen -----------------------------------------------------------------------------------
TIMEZONE=Europe/Warsaw
# SSH public keys allowed to log in as root (one per line in site/authorized_keys)
